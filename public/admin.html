<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ソワレ 管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FBF6F4;--surface:#fff;--ink:#2C2430;--muted:#8A7F86;--anchor:#5C2A45;--accent:#C56B72;--safe:#5E7C6E;--line:#EBE1DE;--shadow:0 1px 2px rgba(44,36,48,.05),0 8px 24px rgba(92,42,69,.06)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;line-height:1.7}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px}
  .brand{font-family:"Shippori Mincho",serif;font-weight:600;font-size:20px;color:var(--anchor)}
  .brand small{font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--muted);margin-left:8px}
  .wrap{max-width:900px;margin:0 auto;padding:20px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{flex:0 0 auto;padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:999px;font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .tabs button.active{background:var(--anchor);color:#fff;border-color:var(--anchor)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
  .row{display:flex;gap:14px;align-items:flex-start}
  .doc{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none;background:#f3ece9}
  .name{font-weight:700}
  .meta{color:var(--muted);font-size:13px}
  .reason{background:#F7EFED;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0;white-space:pre-wrap}
  button.act{font-family:inherit;font-size:14px;border:none;border-radius:999px;padding:9px 18px;cursor:pointer;margin-right:8px;margin-top:8px}
  .approve{background:var(--safe);color:#fff}
  .reject{background:#fff;color:#b0475a;border:1px solid #e3bdc4!important}
  .ban{background:#c0392b;color:#fff}
  .unban{background:#fff;color:var(--anchor);border:1px solid var(--line)!important}
  .resolve{background:var(--anchor);color:#fff}
  a.link{color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .gate{max-width:460px;margin:60px auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px}
  .gate a{color:var(--accent)}
  .badge{display:inline-block;background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px}
  .banned-tag{display:inline-block;background:#c0392b;color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px}
</style>
</head>
<body>
<header><span class="brand">ソワレ<small>ADMIN</small></span></header>
<div class="wrap" id="wrap"><p class="empty">読み込み中…</p></div>

<script>
async function api(path,opts={}){ const r=await fetch('/api'+path,{credentials:'same-origin',...opts}); const d=await r.json().catch(()=>({})); if(!r.ok){const e=new Error(d.error||'エラー');e.status=r.status;throw e;} return d; }
const jpost=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='verify';

(async()=>{
  let ok=false;
  try{ const c=await api('/admin/check'); ok=c.admin; }catch(e){}
  if(!ok){
    document.getElementById('wrap').innerHTML=`<div class="gate"><h2 class="brand" style="font-size:18px">管理者権限がありません</h2>
      <p class="meta">管理者アカウントで <a href="/">ソワレ</a> にログインしてから、この画面を開いてください。</p>
      <p class="meta">（管理者は、対象ユーザーの <code>is_admin=1</code> を設定すると有効になります）</p></div>`;
    return;
  }
  render();
})();

function render(){
  document.getElementById('wrap').innerHTML=`
    <div class="tabs">
      <button id="tabVerify" class="${tab==='verify'?'active':''}" onclick="setTab('verify')">本人確認申請</button>
      <button id="tabReports" class="${tab==='reports'?'active':''}" onclick="setTab('reports')">通報</button>
    </div>
    <div id="list"><p class="empty">読み込み中…</p></div>`;
  tab==='verify'?loadVerify():loadReports();
}
function setTab(t){ tab=t; render(); }

async function loadVerify(){
  const box=document.getElementById('list');
  try{
    const {items}=await api('/admin/verifications');
    if(!items.length){ box.innerHTML='<p class="empty">審査待ちの申請はありません。</p>'; return; }
    box.innerHTML=items.map(v=>`
      <div class="card">
        <div class="row">
          <img class="doc" src="/api/admin/doc?key=${encodeURIComponent(v.doc_key)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <a class="doc" style="display:none;text-align:center;line-height:120px;color:var(--accent)" href="/api/admin/doc?key=${encodeURIComponent(v.doc_key)}" target="_blank">書類を開く</a>
          <div style="flex:1">
            <div class="name">${esc(v.display_name)} <span class="meta">${v.age}・${esc(v.area)}</span></div>
            <div class="meta">申請日時: ${new Date(v.created_at).toLocaleString('ja-JP')}</div>
            <div class="meta"><a class="link" href="/api/admin/doc?key=${encodeURIComponent(v.doc_key)}" target="_blank">書類を別タブで開く</a></div>
            <button class="act approve" onclick="decide('${v.user_id}','approve')">承認する（バッジ付与）</button>
            <button class="act reject" onclick="decide('${v.user_id}','reject')">却下</button>
          </div>
        </div>
      </div>`).join('');
  }catch(e){ box.innerHTML=`<p class="empty">${esc(e.message)}</p>`; }
}
async function decide(user_id,action){
  if(action==='reject'&&!confirm('この申請を却下しますか？'))return;
  try{ await jpost('/admin/verify',{user_id,action}); loadVerify(); }catch(e){ alert(e.message); }
}

async function loadReports(){
  const box=document.getElementById('list');
  try{
    const {items}=await api('/admin/reports');
    if(!items.length){ box.innerHTML='<p class="empty">未対応の通報はありません。</p>'; return; }
    box.innerHTML=items.map(r=>`
      <div class="card">
        <div class="name">${esc(r.target_name||r.target_id)}${r.target_banned?'<span class="banned-tag">BAN中</span>':''}</div>
        <div class="meta">通報者: ${esc(r.reporter_name||r.reporter_id)} ／ ${new Date(r.created_at).toLocaleString('ja-JP')}</div>
        ${r.reason?`<div class="reason">${esc(r.reason)}</div>`:'<div class="meta">（理由の記載なし）</div>'}
        ${r.target_banned
          ? `<button class="act unban" onclick="ban('${r.target_id}',0)">BAN解除</button>`
          : `<button class="act ban" onclick="ban('${r.target_id}',1)">このユーザーをBANする</button>`}
        <button class="act resolve" onclick="resolve('${r.id}')">対応済みにする</button>
      </div>`).join('');
  }catch(e){ box.innerHTML=`<p class="empty">${esc(e.message)}</p>`; }
}
async function ban(user_id,on){
  if(on&&!confirm('このユーザーをBANしますか？一覧から除外され、ログイン・送信ができなくなります。'))return;
  try{ await jpost('/admin/ban',{user_id,ban:on}); loadReports(); }catch(e){ alert(e.message); }
}
async function resolve(id){
  try{ await jpost('/admin/report/resolve',{id}); loadReports(); }catch(e){ alert(e.message); }
}
</script>
</body>
</html>
