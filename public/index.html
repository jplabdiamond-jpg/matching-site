<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Re-Lovers（リラバーズ） — 同じ立場で出会うマッチング</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5C2A45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Re-Lovers">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6F4; --surface:#fff; --ink:#2C2430; --muted:#8A7F86;
    --anchor:#5C2A45; --accent:#C56B72; --safe:#5E7C6E; --line:#EBE1DE;
    --notify:#E0344A;
    --soft:#F3E9E7; --soft2:#EFE4E8;
    --shadow:0 1px 2px rgba(44,36,48,.05), 0 8px 24px rgba(92,42,69,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.7}
  .mincho{font-family:"Shippori Mincho",serif}
  header{position:sticky;top:0;z-index:20;background:rgba(251,246,244,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
  .brand{font-family:"Shippori Mincho",serif;font-weight:600;font-size:21px;letter-spacing:.14em;color:var(--anchor)}
  .brand small{display:block;font-family:"Noto Sans JP";font-weight:400;font-size:9.5px;letter-spacing:.24em;color:var(--muted);margin-top:1px}
  .spacer{flex:1}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:999px;font-size:14px}
  .ghost{background:transparent;color:var(--anchor);padding:9px 14px;position:relative}
  .ghost:hover{background:var(--soft)}
  .solid{background:var(--anchor);color:#fff;padding:9px 20px}
  .solid:hover{background:#4a2138}
  .bell{background:transparent;color:var(--anchor);font-size:21px;padding:4px 8px;position:relative;line-height:1}
  .bell .hbadge{position:absolute;top:0;right:0}
  .hdname{display:flex;align-items:center;gap:8px;background:var(--soft);color:var(--anchor);padding:5px 12px 5px 6px;border-radius:999px;font-size:13px;font-weight:500}
  .hdname .av{width:26px;height:26px;border-radius:50%;overflow:hidden;position:relative;display:grid;place-items:center;flex:none}
  .hdname .av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .hdname .av .ini{font-family:"Shippori Mincho",serif;color:#fff;font-size:13px}
  body:not(.ready) #loginBtn, body:not(.ready) #signupBtn, body:not(.ready) #hdAcct, body:not(.ready) #bellBtn{visibility:hidden}
  .odot{position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:#3fb27f;border:2px solid #fff;z-index:2}
  .online{color:#3fb27f;font-weight:500}
  .chip{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;margin:0 6px 6px 0;cursor:pointer;background:#fff;color:var(--ink)}
  .chip.on{background:var(--anchor);color:#fff;border-color:var(--anchor)}
  .chip.common{background:var(--soft2);border-color:var(--accent);color:var(--anchor);font-weight:500}
  .hbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--notify);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
  .lead{max-width:1080px;margin:0 auto;padding:30px 20px 4px}
  .lead h1{font-family:"Shippori Mincho",serif;font-weight:500;font-size:clamp(22px,4vw,34px);line-height:1.5;margin:0 0 10px;color:var(--anchor)}
  .lead p{max-width:34em;color:var(--muted);margin:0;font-size:14px}
  .secttl{max-width:1080px;margin:26px auto 0;padding:0 20px;display:flex;align-items:baseline;gap:10px}
  .secttl h2{font-family:"Shippori Mincho",serif;font-weight:500;font-size:18px;color:var(--anchor);margin:0}
  .secttl .sub{font-size:12px;color:var(--muted)}
  .grid{max-width:1080px;margin:14px auto 30px;padding:0 20px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s ease}
  .card:hover{transform:translateY(-3px)}
  .ava{aspect-ratio:4/5;display:grid;place-items:center;position:relative;overflow:hidden}
  .ava .ini{font-family:"Shippori Mincho",serif;font-size:44px;color:rgba(255,255,255,.92)}
  .ava img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .badge{position:absolute;top:10px;left:10px;background:var(--safe);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.04em;z-index:2}
  .nbadge2{position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;font-size:10px;padding:3px 8px;border-radius:999px;z-index:2}
  .info{padding:11px 13px 14px}
  .name{font-weight:500;font-size:16px}.name b{font-weight:700}
  .meta{color:var(--muted);font-size:13px;margin:2px 0 7px}
  .tag{font-family:"Shippori Mincho",serif;font-size:13px;color:#6a5d64;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
  /* modals */
  .scrim{position:fixed;inset:0;background:rgba(44,36,48,.5);backdrop-filter:blur(2px);display:none;place-items:center;z-index:70;padding:20px}
  .scrim.on{display:grid}
  .modal{background:var(--surface);border-radius:20px;max-width:460px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(44,36,48,.25);max-height:88vh;overflow:auto;position:relative}
  .mclose{position:absolute;top:14px;right:14px;background:transparent;border:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 8px;z-index:2}
  .modal h2{font-family:"Shippori Mincho",serif;font-weight:500;margin:0 0 4px;color:var(--anchor)}
  .big{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:6px 0 14px;overflow:hidden;position:relative}
  .big .ini{font-family:"Shippori Mincho",serif;font-size:38px;color:#fff}
  .big img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .field{display:block;margin:10px 0}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .full{width:100%;padding:13px;margin-top:14px;font-size:15px}
  .err{color:#b0475a;font-size:13px;min-height:1.2em;margin-top:6px}
  .switch{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
  .switch a{color:var(--accent);cursor:pointer;text-decoration:underline}
  .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:15px;font-weight:500}
  .gbtn:hover{background:#faf5f4}
  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  /* likes cards */
  .lcard{display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow);background:var(--surface)}
  .lcard .lav{width:72px;height:90px;border-radius:10px;overflow:hidden;position:relative;flex:none;display:grid;place-items:center;cursor:pointer}
  .lcard .lav .ini{font-family:"Shippori Mincho",serif;font-size:30px;color:#fff}
  .lcard .lav img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .lcard .lbody{flex:1;min-width:0}
  .lcard .lbody .tag{font-family:"Shippori Mincho",serif;font-size:12.5px;color:#6a5d64;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 8px}
  .lcard .lbody button{padding:8px 16px;font-size:13px}
  /* full-screen pages */
  .page{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column}
  .page.on{display:flex}
  .pbar{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--surface)}
  .pbar .back{font-size:22px;color:var(--anchor);background:transparent;padding:2px 8px;line-height:1}
  .pbar h2{font-family:"Shippori Mincho",serif;font-weight:500;font-size:19px;color:var(--anchor);margin:0}
  .pbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .pbody.pad{padding:16px;padding-bottom:84px}
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:12px;border-radius:0;font-size:14px;font-weight:500;border-bottom:2px solid transparent}
  .tabs button.active{color:var(--anchor);border-bottom-color:var(--anchor)}
  .tabs .tbadge{min-width:16px;height:16px;padding:0 4px;font-size:10px;background:var(--notify);color:#fff;border-radius:999px;display:inline-grid;place-items:center;margin-left:4px;vertical-align:middle}
  .convlist{flex:1;overflow:auto;padding:6px 0}
  .crow{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
  .crow:hover{background:#F7EFED}
  .cav{width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;flex:none;display:grid;place-items:center}
  .cav .ini{font-family:"Shippori Mincho",serif;color:#fff;font-size:22px}
  .cav img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .cbody{flex:1;min-width:0}
  .ctop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .cname{font-weight:500}
  .ctime{font-size:11px;color:var(--muted);flex:none}
  .cprev{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .cunread{min-width:20px;height:20px;padding:0 6px;background:var(--notify);color:#fff;font-size:11px;font-weight:700;border-radius:999px;display:grid;place-items:center;flex:none}
  .empty{color:var(--muted);text-align:center;padding:60px 24px;font-size:14px;line-height:1.9}
  /* chat */
  #view-chat .pbar .cav{width:38px;height:38px}
  .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;max-width:760px;width:100%;margin:0 auto}
  .b{max-width:76%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
  .b.me{align-self:flex-end;background:var(--anchor);color:#fff;border-bottom-right-radius:5px}
  .b.you{align-self:flex-start;background:#F1E7E4;color:var(--ink);border-bottom-left-radius:5px}
  .bwrap{display:flex;flex-direction:column;max-width:100%}
  .bwrap.me{align-items:flex-end}.bwrap.you{align-items:flex-start}
  .btime{font-size:10px;color:var(--muted);margin:2px 6px 0}
  .composer{display:flex;gap:8px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);max-width:760px;width:100%;margin:0 auto}
  .composer input{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:999px;font-family:inherit;font-size:15px}
  .planbar{background:#F7EFED;color:#6a5d64;text-align:center;padding:10px;font-size:13px;cursor:pointer}
  @keyframes bubbleIn{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
  .bwrap.enter .b{animation:bubbleIn .22s cubic-bezier(.22,1,.36,1)}
  .receipt{font-size:10px;color:var(--muted);margin:2px 6px 0}
  .iconbtn{background:transparent;color:var(--anchor);font-size:24px;padding:2px 10px;line-height:1}
  #view-chat.selecting .bwrap.me{cursor:pointer}
  #view-chat.selecting .bwrap.me.sel .b{outline:2px solid var(--accent);outline-offset:2px}
  .selbar{display:flex;gap:10px;align-items:center;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
  .selbar .cnt{flex:1;color:var(--muted);font-size:13px}
  .cmenu-scrim{position:fixed;inset:0;background:rgba(44,36,48,.35);z-index:60;display:none}
  .cmenu-scrim.on{display:block}
  .cmenu{position:absolute;top:60px;right:14px;width:240px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(44,36,48,.25);overflow:hidden}
  .cmenu button{display:block;width:100%;text-align:center;background:#fff;color:var(--ink);padding:15px;border-radius:0;border-bottom:1px solid var(--line);font-size:15px}
  .cmenu button:last-child{border-bottom:none}
  .cmenu button.danger{color:#c0392b}
  .cmenu button:hover{background:#f7efed}
  @media (max-width:640px){
    .cmenu{top:auto;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto;border-radius:16px}
    .cmenu button{padding:17px;font-size:16px}
  }
  /* bottom nav (5 tabs) */
  .botnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:none}
  body.authed .botnav{display:flex}
  body.chat-open .botnav{display:none}
  .botnav button{flex:1;background:transparent;border:none;border-radius:0;padding:7px 2px calc(7px + env(safe-area-inset-bottom));font-size:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .botnav button.active{color:var(--anchor)}
  .botnav .ic{font-size:20px;line-height:1}
  .nbadge{position:absolute;top:3px;left:calc(50% + 7px);right:auto;min-width:16px;height:16px;padding:0 4px;background:var(--notify);color:#fff;font-size:10px;font-weight:700;border-radius:999px;display:none;place-items:center;box-shadow:0 0 0 2px var(--surface)}
  body.authed{padding-bottom:62px}
  body.authed .page .pbody.pad{padding-bottom:84px}
  /* profile detail (cad-style) */
  .pf-hero{position:relative;width:100%;aspect-ratio:1/1;max-height:460px;background:var(--line);overflow:hidden;border-radius:0}
  .pf-hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .pf-hero .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:"Shippori Mincho",serif;font-size:72px;color:#fff}
  .pf-active{position:absolute;top:12px;left:12px;background:rgba(44,36,48,.55);color:#fff;font-size:12px;padding:5px 11px;border-radius:999px;display:flex;align-items:center;gap:6px;z-index:2}
  .pf-active .dot{width:8px;height:8px;border-radius:50%;background:#3fb27f}
  .pf-vbadge{position:absolute;top:12px;right:12px;background:var(--safe);color:#fff;font-size:11px;padding:4px 10px;border-radius:999px;z-index:2}
  .pf-thumbs{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto}
  .pf-thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none;border:2px solid transparent}
  .pf-thumbs img.sel{border-color:var(--accent)}
  .pf-sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 16px 0}
  .pf-sec h3{font-family:"Shippori Mincho",serif;font-weight:500;font-size:15px;color:var(--anchor);margin:0 0 10px;display:flex;align-items:center;gap:7px}
  .pf-name{font-family:"Shippori Mincho",serif;font-size:24px;color:var(--ink);margin:0}
  .pf-name span{font-size:17px;color:var(--muted);margin-left:6px}
  .pf-bio{color:#5a5057;font-size:14.5px;white-space:pre-wrap;line-height:1.85;margin:0}
  .pf-rows{display:grid;gap:0}
  .pf-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .pf-row:last-child{border-bottom:none}
  .pf-row .k{color:var(--muted);width:7.5em;flex:none;display:flex;align-items:center;gap:6px}
  .pf-row .v{color:var(--ink);flex:1}
  .pf-row .v.na{color:#c3b8bd}
  .slotgrid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;font-size:12.5px}
  .slotgrid .hd{color:var(--muted);text-align:center;padding:4px 0}
  .slotgrid .rl{color:var(--muted);display:flex;align-items:center}
  .slotcell{text-align:center;padding:8px 0;border-radius:8px;background:var(--bg);color:#c3b8bd;border:1px solid var(--line)}
  .slotcell.on{background:var(--soft2);color:var(--anchor);border-color:var(--accent);font-weight:600}
  .pf-actions{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
  .pf-actions .like{flex:1;background:var(--anchor);color:#fff;padding:15px;font-size:16px;font-weight:600;border-radius:14px;box-shadow:var(--shadow)}
  .pf-actions .mini{width:52px;height:52px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:20px;display:grid;place-items:center;flex:none}
  .tagwrap{display:flex;flex-wrap:wrap}
  /* mypage / plan */
  .mp-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .mp-head{display:flex;align-items:center;gap:14px}
  .mp-head .av{width:64px;height:64px;border-radius:50%;overflow:hidden;position:relative;display:grid;place-items:center;flex:none}
  .mp-head .av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .mp-head .av .ini{font-family:"Shippori Mincho",serif;color:#fff;font-size:26px}
  .mp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .mp-stat{background:var(--bg);border-radius:12px;padding:12px 6px;text-align:center}
  .mp-stat b{display:block;font-size:20px;color:var(--anchor);font-family:"Shippori Mincho",serif}
  .mp-stat span{font-size:11px;color:var(--muted)}
  .mp-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;color:var(--ink);font-size:14.5px}
  .mp-link:hover{background:var(--soft)}
  .mp-link .ic{font-size:18px;width:24px;text-align:center}
  .mp-link .ar{margin-left:auto;color:var(--muted)}
  .planpill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft2);color:var(--anchor)}
  .plan-card{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;background:var(--surface)}
  .plan-card.hi{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft2)}
  .plan-card h3{font-family:"Shippori Mincho",serif;font-weight:600;font-size:18px;color:var(--anchor);margin:0 0 2px}
  .plan-card .price{font-size:22px;font-weight:700;color:var(--ink);margin:6px 0}
  .plan-card .price small{font-size:12px;color:var(--muted);font-weight:400}
  .plan-card ul{list-style:none;padding:0;margin:10px 0 0;font-size:13.5px;color:#5a5057}
  .plan-card li{padding:5px 0 5px 22px;position:relative}
  .plan-card li::before{content:"✓";position:absolute;left:0;color:var(--safe);font-weight:700}
  .cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .cmp th,.cmp td{border:1px solid var(--line);padding:9px 8px;text-align:center}
  .cmp th{background:var(--soft);color:var(--anchor);font-weight:600}
  .cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--muted);font-weight:400}
  .cmp .yes{color:var(--safe);font-weight:700}
  .cmp .no{color:#c3b8bd}
  /* notice */
  .ntc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
  .ntc .d{font-size:11px;color:var(--muted)}
  .ntc .t{font-weight:600;font-size:14.5px;margin:3px 0 4px;color:var(--ink)}
  .ntc .x{font-size:13px;color:#5a5057;margin:0}
  .ntc .cat{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:var(--soft2);color:var(--anchor);margin-right:6px}
  /* search page */
  .srch-input{display:flex;gap:8px;margin-bottom:14px}
  .srch-input input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:999px;font-family:inherit;font-size:14px;background:#fff}
  .fblock{margin-bottom:18px}

  const h=Math.floor(m/60); if(h<24)return h+'時間前';

      <div class="tag">${esc(it.tagline)}</div></div>`;

function buildQS(){
  const qs=new URLSearchParams();
  if(searchF.area)qs.set('area',searchF.area);
  if(searchF.min)qs.set('min',searchF.min);
  if(searchF.max)qs.set('max',searchF.max);
  if(searchF.q)qs.set('q',searchF.q);
  qs.set('sort',searchF.sort||'active');
  if(searchF.verified)qs.set('verified','1');
  if(searchF.online)qs.set('online','1');
  if(tagFilter)qs.set('tag',tagFilter);
  return qs;
}
let searchF={area:'',min:'',max:'',q:'',sort:'active',verified:false,online:false,_tag:''};
async function loadProfiles(reset=true){
  if(expState.loading)return;
  if(reset){ expState={offset:0,loading:false,done:false}; document.getElementById('grid').innerHTML=''; }
  if(expState.done)return;
  expState.loading=true;
  const qs=buildQS();
  qs.set('limit','24'); qs.set('offset',expState.offset);
  document.getElementById('homeSub').textContent=(searchF.sort==='new'?'新着順':'アクティブ順')+(tagFilter?'・'+tagFilter:'')+(searchF.area?'・'+searchF.area:'');
  try{
    const {items}=await api('/profiles?'+qs.toString());
    const grid=document.getElementById('grid');
    if(expState.offset===0 && !items.length){ grid.innerHTML='<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px 0">条件に合う方が見つかりませんでした。</p>'; expState.done=true; }
    for(const it of items) grid.appendChild(renderCard(it));
    expState.offset+=items.length;
    if(items.length<24) expState.done=true;
  }catch(e){}
  expState.loading=false;
}

/* ---- プロフィール閲覧の滞在時間トラッキング ---- */
let dwellStart=0, dwellTarget=null;
function startDwell(id){ flushDwell(); dwellTarget=id; dwellStart=Date.now(); }
function flushDwell(){
  if(!dwellTarget) return;
  const ms=Date.now()-dwellStart, owner=dwellTarget;
  dwellTarget=null; dwellStart=0;
  if(ms<2000 || !me) return;
  try{
    const blob=new Blob([JSON.stringify({owner_id:owner,ms})],{type:'application/json'});
    if(!(navigator.sendBeacon && navigator.sendBeacon('/api/view/dwell',blob))) jpost('/view/dwell',{owner_id:owner,ms}).catch(()=>{});
  }catch{ jpost('/view/dwell',{owner_id:owner,ms}).catch(()=>{}); }
}
window.addEventListener('pagehide',flushDwell);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushDwell(); });

  }
  // 属性行
  const rows=ATTR_META.map(([key,ic,label])=>{
    const v=attrVal(p,key);
    return `<div class="pf-row"><div class="k">${svg(ic)} ${label}</div><div class="v ${v?'':'na'}">${v?esc(v):'未設定'}</div></div>`;

  const tagSec=(p.tags&&p.tags.length)?`<div class="pf-sec"><h3>${svg('tag')} 興味・関心</h3><div class="tagwrap">${p.tags.map(t=>`<span class="chip ${me&&me.tags&&me.tags.includes(t)?'common':''}" onclick="filterByTag('${t}')">${esc(t)}</span>`).join('')}</div></div>`:'';
  const own=me&&me.id===p.user_id;
  const actions=own?'':`<div class="pf-actions">
      <button class="like" id="likeBtn">${svg('heart')} いいねを送る</button>
    </div>`;
  document.getElementById('profileBody').innerHTML=`
    <div class="pf-hero">${hero}${act}${vb}</div>
    ${thumbs}
    <div class="pf-sec"><h3 style="margin:0"><span class="pf-name mincho">${esc(p.display_name)}<span>${p.age}歳・${esc(p.area||'')}</span></span></h3>
      ${p.tagline?`<p class="mincho" style="color:#6a5d64;margin:10px 0 0;font-size:15px">${esc(p.tagline)}</p>`:''}
      ${[p.purpose,p.marital].filter(Boolean).length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${[p.purpose,p.marital].filter(Boolean).map(s=>`<span class="chip" style="margin:0;cursor:default;font-size:12px;padding:4px 11px">${esc(s)}</span>`).join('')}</div>`:''}</div>
    ${bioSec}${slotSec}${attrSec}${tagSec}
    <div style="height:8px"></div>
    ${actions}`;
  openPage('view-profile');
  document.getElementById('profileBody').scrollTop=0;
  if(me && p.user_id!==me.id) startDwell(p.user_id); else flushDwell();
  const lb=document.getElementById('likeBtn'); if(lb) lb.onclick=()=>sendLike(p.user_id);

function appendBubble(m,mine,animate){
  const box=document.getElementById('msgs');
  const w=document.createElement('div'); w.className='bwrap '+(mine?'me':'you')+(animate?' enter':'');
  w.dataset.id=m.id; w.dataset.ts=m.created_at; w.dataset.me=mine?'1':'0';
  const b=document.createElement('div'); b.className='b '+(mine?'me':'you'); b.textContent=m.body;
  const t=document.createElement('div'); t.className='btime'; t.textContent=fmtTime(m.created_at);
  w.appendChild(b); w.appendChild(t); box.appendChild(w);
  return w;
}
function updateReceipts(readAt){
  const box=document.getElementById('msgs'); if(!box)return;
  box.querySelectorAll('.receipt').forEach(r=>r.remove());
  const mine=[...box.querySelectorAll('.bwrap.me')].filter(w=>Number(w.dataset.ts)<=readAt);
  if(mine.length){ const r=document.createElement('div'); r.className='receipt'; r.textContent='既読'; mine[mine.length-1].appendChild(r); }
}
async function pollMessages(initial){
  if(!chatState.matchId)return;
  try{
    const data=await api(`/messages?match_id=${chatState.matchId}&after=${chatState.after}`);
    const uid=data.me;
    const box=document.getElementById('msgs'); if(!box||!document.getElementById('view-chat').classList.contains('on'))return;
    let added=false;
    for(const m of data.items){ chatState.after=Math.max(chatState.after,m.created_at); appendBubble(m,m.from_id===uid,!initial); added=true; }
    updateReceipts(data.read_at||0);
    if(added){ box.scrollTop=box.scrollHeight; jpost('/read',{match_id:chatState.matchId}).then(()=>pollUnread()).catch(()=>{}); }
    else if(initial) box.scrollTop=box.scrollHeight;
  }catch(e){}
}
async function doSend(){
  const input=document.getElementById('msgInput'); if(!input)return;
  const text=input.value.trim(); if(!text)return; input.value='';
  try{
    const m=await jpost('/messages',{match_id:chatState.matchId,body:text});
    chatState.after=Math.max(chatState.after,m.created_at);
    appendBubble(m,true,true);
    const box=document.getElementById('msgs'); box.scrollTop=box.scrollHeight;
  }catch(e){ if(e.status===402){openUpgrade();} else toast(e.message); }
}

    <div style="font-size:13px;font-weight:600;color:var(--anchor);margin:18px 0 4px">基本情報</div>
    <div class="field"><label>探している関係</label><select id="myPurpose">${selOpts('purpose',me.purpose)}</select></div>
    <div class="row2">
      <div class="field"><label>婚姻状況</label><select id="myMarital">${selOpts('marital',me.marital)}</select></div>
      <div class="field"><label>子ども</label><select id="myChildren">${selOpts('children',me.children)}</select></div>
    </div>
    <div class="field"><label>お仕事</label><input id="myJob" maxlength="40" value="${esc(me.job||'')}" placeholder="例）会社員 / 看護師"></div>
    <div class="row2">
      <div class="field"><label>年収</label><select id="myIncome">${selOpts('income',me.income)}</select></div>
      <div class="field"><label>最終学歴</label><select id="myEducation">${selOpts('education',me.education)}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>身長(cm)</label><input id="myHeight" type="number" min="130" max="230" value="${me.height||''}"></div>
      <div class="field"><label>体型</label><select id="myBody">${selOpts('body_type',me.body_type)}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>お酒</label><select id="myDrink">${selOpts('drinking',me.drinking)}</select></div>
      <div class="field"><label>タバコ</label><select id="mySmoke">${selOpts('smoking',me.smoking)}</select></div>
    </div>
    <div class="field"><label>休日</label><select id="myHoliday">${selOpts('holiday',me.holiday)}</select></div>

    <div style="font-size:12px;color:var(--muted);margin:16px 0 6px">趣味・興味タグ（最大15個・相手との共通タグはハイライト表示されます）</div>
    <div id="tagArea"></div>
    <div style="margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:10px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--ink)">
        <input type="checkbox" id="myPrivate" ${me.private_mode?'checked':''} style="width:auto" onchange="togglePrivacy(this.checked)">
        身バレ防止（プライベートモード）
      </label>
      <div class="note" style="margin-top:4px">ONにすると、あなたが「いいね」した相手にだけプロフィールが表示され、一覧・検索には出なくなります。</div>
    </div>
    <div class="err" id="myErr" style="margin-top:10px"></div>
    <button class="solid full" onclick="saveMyEdit()">保存する</button>
    <button class="ghost full" style="margin-top:6px" onclick="document.getElementById('myScrim').classList.remove('on')">閉じる</button>`;
  renderTags();
}
function toggleSlot(el){ el.classList.toggle('on'); el.textContent=el.classList.contains('on')?'◯':''; }
function collectAvail(){ return [...document.querySelectorAll('#slotEditor .slotcell.on')].map(c=>c.dataset.code).join(','); }
function renderTags(){
  const area=document.getElementById('tagArea'); if(!area)return;
  const preset=PRESET_TAGS.map(t=>`<span class="chip ${myTags.includes(t)?'on':''}" onclick="toggleTag('${t}')">${t}</span>`).join('');
  const custom=myTags.filter(t=>!PRESET_TAGS.includes(t)).map(t=>`<span class="chip on" onclick="toggleTag('${t}')">${esc(t)} ✕</span>`).join('');
  area.innerHTML=`<div style="margin-bottom:8px">${preset}${custom}</div>
    <div style="display:flex;gap:8px"><input id="tagInput" placeholder="自由に追加" maxlength="20" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px"><button class="ghost" style="border:1px solid var(--line)" onclick="addCustomTag()">追加</button></div>`;
}
function toggleTag(t){ const i=myTags.indexOf(t); if(i>=0)myTags.splice(i,1); else{ if(myTags.length>=15){toast('タグは15個までです');return;} myTags.push(t);} renderTags(); }
function addCustomTag(){ const el=document.getElementById('tagInput'); let t=(el.value||'').trim().replace(/['"\\<>]/g,''); if(!t)return; if(!myTags.includes(t)){ if(myTags.length>=15){toast('タグは15個までです');return;} myTags.push(t);} el.value=''; renderTags(); }
async function saveMyEdit(){
  const err=document.getElementById('myErr'); err.textContent='';
  try{
    await jpost('/profile/update',{
      display_name:document.getElementById('myName').value.trim(),
      gender:document.getElementById('myGender').value,
      age:document.getElementById('myAge').value,
      area:document.getElementById('myArea').value,
      tagline:document.getElementById('myTag').value.trim(),
      bio:document.getElementById('myBio').value.trim(),
      purpose:document.getElementById('myPurpose').value,
      marital:document.getElementById('myMarital').value,
      children:document.getElementById('myChildren').value,
      job:document.getElementById('myJob').value.trim(),
      income:document.getElementById('myIncome').value,
      education:document.getElementById('myEducation').value,
      height:document.getElementById('myHeight').value,
      body_type:document.getElementById('myBody').value,
      drinking:document.getElementById('myDrink').value,
      smoking:document.getElementById('mySmoke').value,
      holiday:document.getElementById('myHoliday').value,
      avail:collectAvail()});
    await jpost('/tags/set',{tags:myTags});
    document.getElementById('myScrim').classList.remove('on');
    await loadMe(); await loadProfiles(); if(location.hash==='#mypage')renderMyPagePage(); toast('プロフィールを更新しました');
  }catch(e){ err.textContent=e.message; }
}
async function setMainPhoto(k){ try{await jpost('/photos/main',{key:k});await loadMe();const pd=await api('/photos/mine');renderMyEdit(pd);await loadProfiles();toast('メイン写真を変更しました');}catch(e){toast(e.message);} }
async function deletePhoto(k){ if(!confirm('この写真を削除しますか？'))return; try{await jpost('/photos/delete',{key:k});await loadMe();const pd=await api('/photos/mine');renderMyEdit(pd);await loadProfiles();toast('写真を削除しました');}catch(e){toast(e.message);} }
async function togglePrivacy(on){ try{await jpost('/privacy',{private_mode:on?1:0});me.private_mode=on?1:0;await loadProfiles();toast(on?'身バレ防止をONにしました':'身バレ防止をOFFにしました');}catch(e){toast(e.message);} }
async function openBlockList(){
  try{ const {items}=await api('/blocks');
    const list=items.length?items.map(it=>`
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
        <div style="width:42px;height:42px;border-radius:50%;overflow:hidden;position:relative;flex:none;display:grid;place-items:center;background:${grad(it.display_name)}">${avatarHTML(it)}</div>
        <div style="flex:1;min-width:0"><b>${esc(it.display_name)}</b> ${it.age}<div class="meta" style="margin:0">${esc(it.area)}</div></div>
        <button class="ghost" style="border:1px solid var(--line)" onclick="doUnblock('${it.user_id}')">解除</button>
      </div>`).join(''):'<p class="note">ブロックした人はいません。</p>';
    document.getElementById('pModal').innerHTML=`<h2 class="mincho">ブロックした人</h2><div style="margin-top:10px">${list}</div>
      <button class="ghost full" style="margin-top:12px;border:1px solid var(--line)" onclick="document.getElementById('pScrim').classList.remove('on')">閉じる</button>`;
    document.getElementById('pScrim').classList.add('on');
  }catch(e){ toast(e.message); }
}
async function doUnblock(id){ try{await jpost('/unblock',{target_id:id});await loadProfiles();openBlockList();toast('ブロックを解除しました');}catch(e){toast(e.message);} }
document.getElementById('verifyInput').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  if(f.size>8*1024*1024){toast('8MBまでにしてください');return;}
  toast('送信中…');
  try{await api('/verify',{method:'POST',headers:{'Content-Type':f.type},body:f});toast('本人確認を申請しました（審査中）');await loadMe();if(location.hash==='#mypage')renderMyPagePage();}
  catch(err){toast(err.message);}
};

/* ---- オンボーディング ---- */
function openOnboard(){
  document.getElementById('onboardModal').innerHTML=`
    <h2 class="mincho">プロフィールを作成</h2>
    <p class="note" style="margin:6px 0 4px">はじめまして。表示されるプロフィールを設定してください。</p>
    <div class="field"><label>ニックネーム</label><input id="oName" placeholder="あおい"></div>
    <div class="row2">
      <div class="field"><label>性別</label><select id="oGender"><option value="female">女性</option><option value="male">男性</option><option value="other">その他</option></select></div>
      <div class="field"><label>年齢</label><input id="oAge" type="number" min="18" placeholder="34"></div></div>
    <div class="field"><label>エリア</label><select id="oArea">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select></div>
    <div class="err" id="oErr"></div>
    <button class="solid full" onclick="submitOnboard()">はじめる</button>`;
  document.getElementById('onboardScrim').classList.add('on');
}
async function submitOnboard(){
  const err=document.getElementById('oErr'); err.textContent='';
  try{ await jpost('/onboard',{display_name:v('oName'),gender:v('oGender'),age:v('oAge'),area:v('oArea')});
    document.getElementById('onboardScrim').classList.remove('on'); await loadMe(); await loadProfiles(); toast('ようこそ');
    if(me && !me.photo_key) openMyEdit(true);
  }catch(e){ err.textContent=e.message; }
}

/* ---- 認証 ---- */
function openAuth(mode){
  const isSignup=mode==='signup';
  document.getElementById('authTitle').textContent=isSignup?'はじめる':'ログイン';
  document.getElementById('authSubmit').textContent=isSignup?'登録する':'ログイン';
  document.getElementById('authErr').textContent='';
  document.getElementById('authFields').innerHTML=isSignup?`
    <div class="field"><label>ニックネーム</label><input id="aName" placeholder="あおい"></div>
    <div class="row2">
      <div class="field"><label>性別</label><select id="aGender"><option value="female">女性</option><option value="male">男性</option><option value="other">その他</option></select></div>
      <div class="field"><label>年齢</label><input id="aAge" type="number" min="18" placeholder="34"></div></div>
    <div class="field"><label>エリア</label><select id="aArea">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select></div>
    <div class="field"><label>メールアドレス</label><input id="aEmail" type="email"></div>
    <div class="field"><label>パスワード</label><input id="aPass" type="password"></div>`:`
    <div class="field"><label>メールアドレス</label><input id="aEmail" type="email"></div>
    <div class="field"><label>パスワード</label><input id="aPass" type="password"></div>`;
  document.getElementById('authSwitch').innerHTML=isSignup?'アカウントをお持ちですか？ <a onclick="openAuth(\'login\')">ログイン</a>':'はじめての方は <a onclick="openAuth(\'signup\')">アカウント作成</a>';
  document.getElementById('authSubmit').onclick=()=>submitAuth(isSignup);
  document.getElementById('authScrim').classList.add('on');
}
async function submitAuth(isSignup){
  const err=document.getElementById('authErr'); err.textContent='';
  const body={email:v('aEmail'),password:v('aPass')};
  if(isSignup)Object.assign(body,{display_name:v('aName'),gender:v('aGender'),age:v('aAge'),area:v('aArea')});
  try{await jpost(isSignup?'/signup':'/login',body);closeModals();await loadMe();await loadProfiles();toast('ようこそ');
    if(isSignup && me && !me.photo_key) openMyEdit(true);}
  catch(e){err.textContent=e.message;}
}
const v=id=>document.getElementById(id).value.trim();
async function doLogout(){try{await jpost('/logout',{});}catch{} me=null;renderAuthState();goHome();loadProfiles();toast('ログアウトしました');}
function urlB64ToUint8Array(b64){ const pad='='.repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(s); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i); return arr; }
async function enablePush(){
  if(!me){openAuth('login');return;}
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){ toast('この端末/ブラウザは通知に対応していません'); return; }
  try{
    const {publicKey}=await api('/vapid');
    if(!publicKey){ toast('サーバー側の通知鍵が未設定です'); return; }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('通知が許可されませんでした'); return; }
    const reg=await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(publicKey)});
    const j=sub.toJSON();
    await jpost('/push/subscribe',{endpoint:j.endpoint, keys:j.keys});
    toast('端末通知をオンにしました');
  }catch(e){ toast('通知の設定に失敗しました: '+(e.message||e)); }
}

/* ---- 共通 ---- */
function closeModals(){ document.querySelectorAll('.scrim').forEach(s=>{ if(s.id!=='onboardScrim') s.classList.remove('on'); }); }
document.querySelectorAll('.scrim').forEach(s=>s.onclick=e=>{if(e.target===s&&s.id!=='onboardScrim')s.classList.remove('on');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});
document.getElementById('loginBtn').onclick=()=>openAuth('login');
document.getElementById('signupBtn').onclick=()=>openAuth('signup');
document.getElementById('chatMenuBtn').onclick=openChatMenu;
document.getElementById('chatMenuScrim').onclick=e=>{ if(e.target.id==='chatMenuScrim') closeChatMenu(); };
document.getElementById('pfMenuScrim').onclick=e=>{ if(e.target.id==='pfMenuScrim') closePfMenu(); };
document.getElementById('msgs').addEventListener('click',e=>{ if(!selecting)return; const w=e.target.closest('.bwrap.me'); if(!w)return; w.classList.toggle('sel'); updateSelCnt(); });

document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=svg(e.dataset.ic));
(async()=>{
  await loadMe(); loadProfiles();
  if(me && me.needs_onboarding) openOnboard();
  const sp=new URLSearchParams(location.search);
  if(sp.get('auth_error')) toast('ログインに失敗しました。もう一度お試しください');
  if(sp.get('upgraded')) toast('アップグレードありがとうございます');
  if(location.search) history.replaceState({},'',location.pathname+location.hash);
  router();
})();
</script>
