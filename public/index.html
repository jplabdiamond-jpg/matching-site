<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ソワレ — 同じ立場で出会うマッチング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6F4; --surface:#fff; --ink:#2C2430; --muted:#8A7F86;
    --anchor:#5C2A45; --accent:#C56B72; --safe:#5E7C6E; --line:#EBE1DE;
    --shadow:0 1px 2px rgba(44,36,48,.05), 0 8px 24px rgba(92,42,69,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.7}
  .mincho{font-family:"Shippori Mincho",serif}
  header{position:sticky;top:0;z-index:20;background:rgba(251,246,244,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:10px}
  .brand{font-family:"Shippori Mincho",serif;font-weight:600;font-size:22px;letter-spacing:.14em;color:var(--anchor)}
  .brand small{display:block;font-family:"Noto Sans JP";font-weight:400;font-size:10px;letter-spacing:.24em;color:var(--muted);margin-top:2px}
  .spacer{flex:1}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:999px;font-size:14px}
  .ghost{background:transparent;color:var(--anchor);padding:9px 14px;position:relative}
  .ghost:hover{background:#F3E9E7}
  .solid{background:var(--anchor);color:#fff;padding:9px 20px}
  .solid:hover{background:#4a2138}
  body:not(.ready) #loginBtn, body:not(.ready) #signupBtn, body:not(.ready) #msgBtn, body:not(.ready) #likesBtn{visibility:hidden}
  .hbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
  .lead{max-width:1080px;margin:0 auto;padding:40px 20px 8px}
  .lead h1{font-family:"Shippori Mincho",serif;font-weight:500;font-size:clamp(26px,4.4vw,40px);line-height:1.5;margin:0 0 12px;color:var(--anchor)}
  .lead p{max-width:34em;color:var(--muted);margin:0}
  .filters{max-width:1080px;margin:24px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px}
  .filters select{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:120px}
  .grid{max-width:1080px;margin:20px auto 80px;padding:0 20px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s ease}
  .card:hover{transform:translateY(-3px)}
  .ava{aspect-ratio:4/5;display:grid;place-items:center;position:relative;overflow:hidden}
  .ava .ini{font-family:"Shippori Mincho",serif;font-size:44px;color:rgba(255,255,255,.92)}
  .ava img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .badge{position:absolute;top:10px;left:10px;background:var(--safe);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.04em;z-index:2}
  .info{padding:12px 14px 15px}
  .name{font-weight:500;font-size:16px}.name b{font-weight:700}
  .meta{color:var(--muted);font-size:13px;margin:2px 0 8px}
  .tag{font-family:"Shippori Mincho",serif;font-size:13.5px;color:#6a5d64;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
  /* modals */
  .scrim{position:fixed;inset:0;background:rgba(44,36,48,.5);backdrop-filter:blur(2px);display:none;place-items:center;z-index:40;padding:20px}
  .scrim.on{display:grid}
  .modal{background:var(--surface);border-radius:20px;max-width:440px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(44,36,48,.25);max-height:86vh;overflow:auto}
  .modal h2{font-family:"Shippori Mincho",serif;font-weight:500;margin:0 0 4px;color:var(--anchor)}
  .big{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:6px 0 14px;overflow:hidden;position:relative}
  .big .ini{font-family:"Shippori Mincho",serif;font-size:38px;color:#fff}
  .big img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .field{display:block;margin:10px 0}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .full{width:100%;padding:13px;margin-top:14px;font-size:15px}
  .err{color:#b0475a;font-size:13px;min-height:1.2em;margin-top:6px}
  .switch{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
  .switch a{color:var(--accent);cursor:pointer;text-decoration:underline}
  .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:15px;font-weight:500}
  .gbtn:hover{background:#faf5f4}
  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .menu{position:absolute;top:56px;right:20px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:30;display:none;min-width:200px}
  .menu.on{display:block}
  .menu button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);padding:10px 14px;border-radius:10px;font-size:14px}
  .menu button:hover{background:#F3E9E7}
  /* likes cards */
  .lcard{display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .lcard .lav{width:70px;height:88px;border-radius:10px;overflow:hidden;position:relative;flex:none;display:grid;place-items:center}
  .lcard .lav .ini{font-family:"Shippori Mincho",serif;font-size:30px;color:#fff}
  .lcard .lav img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .lcard .lbody{flex:1;min-width:0}
  .lcard .lbody .tag{font-family:"Shippori Mincho",serif;font-size:12.5px;color:#6a5d64;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 8px}
  .lcard .lbody button{padding:8px 16px;font-size:13px}
  /* full-screen pages */
  .page{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column}
  .page.on{display:flex}
  .pbar{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--surface)}
  .pbar .back{font-size:22px;color:var(--anchor);background:transparent;padding:2px 8px;line-height:1}
  .pbar h2{font-family:"Shippori Mincho",serif;font-weight:500;font-size:19px;color:var(--anchor);margin:0}
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:12px;border-radius:0;font-size:14px;font-weight:500;border-bottom:2px solid transparent}
  .tabs button.active{color:var(--anchor);border-bottom-color:var(--anchor)}
  .tabs .tbadge{min-width:16px;height:16px;padding:0 4px;font-size:10px;background:var(--accent);color:#fff;border-radius:999px;display:inline-grid;place-items:center;margin-left:4px;vertical-align:middle}
  .convlist{flex:1;overflow:auto;padding:6px 0}
  .crow{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
  .crow:hover{background:#F7EFED}
  .cav{width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;flex:none;display:grid;place-items:center}
  .cav .ini{font-family:"Shippori Mincho",serif;color:#fff;font-size:22px}
  .cav img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .cbody{flex:1;min-width:0}
  .ctop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .cname{font-weight:500}
  .ctime{font-size:11px;color:var(--muted);flex:none}
  .cprev{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .cunread{min-width:20px;height:20px;padding:0 6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:999px;display:grid;place-items:center;flex:none}
  .empty{color:var(--muted);text-align:center;padding:60px 24px;font-size:14px;line-height:1.9}
  /* chat */
  #view-chat .pbar .cav{width:38px;height:38px}
  .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;max-width:760px;width:100%;margin:0 auto}
  .b{max-width:76%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
  .b.me{align-self:flex-end;background:var(--anchor);color:#fff;border-bottom-right-radius:5px}
  .b.you{align-self:flex-start;background:#F1E7E4;color:var(--ink);border-bottom-left-radius:5px}
  .bwrap{display:flex;flex-direction:column;max-width:100%}
  .bwrap.me{align-items:flex-end}.bwrap.you{align-items:flex-start}
  .btime{font-size:10px;color:var(--muted);margin:2px 6px 0}
  .composer{display:flex;gap:8px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);max-width:760px;width:100%;margin:0 auto}
  .composer input{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:999px;font-family:inherit;font-size:15px}
  .planbar{background:#F7EFED;color:#6a5d64;text-align:center;padding:10px;font-size:13px;cursor:pointer}
  @keyframes bubbleIn{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
  .bwrap.enter .b{animation:bubbleIn .22s cubic-bezier(.22,1,.36,1)}
  .receipt{font-size:10px;color:var(--muted);margin:2px 6px 0}
  .iconbtn{background:transparent;color:var(--anchor);font-size:24px;padding:2px 10px;line-height:1}
  #view-chat.selecting .bwrap.me{cursor:pointer}
  #view-chat.selecting .bwrap.me.sel .b{outline:2px solid var(--accent);outline-offset:2px}
  .selbar{display:flex;gap:10px;align-items:center;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
  .selbar .cnt{flex:1;color:var(--muted);font-size:13px}
  .cmenu-scrim{position:fixed;inset:0;background:rgba(44,36,48,.35);z-index:60;display:none}
  .cmenu-scrim.on{display:block}
  .cmenu{position:absolute;top:60px;right:14px;width:240px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(44,36,48,.25);overflow:hidden}
  .cmenu button{display:block;width:100%;text-align:center;background:#fff;color:var(--ink);padding:15px;border-radius:0;border-bottom:1px solid var(--line);font-size:15px}
  .cmenu button:last-child{border-bottom:none}
  .cmenu button.danger{color:#c0392b}
  .cmenu button:hover{background:#f7efed}
  @media (max-width:640px){
    .cmenu{top:auto;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto;border-radius:16px}
    .cmenu button{padding:17px;font-size:16px}
  }
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--anchor);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:80;pointer-events:none;max-width:90vw}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">ソワレ<small>SOIRÉE MATCHING</small></div>
    <div class="spacer"></div>
    <button class="ghost" id="likesBtn" style="display:none">相手からのいいね<span class="hbadge" id="likesBadge" style="display:none">0</span></button>
    <button class="ghost" id="msgBtn" style="display:none">メッセージ<span class="hbadge" id="msgBadge" style="display:none">0</span></button>
    <button class="ghost" id="loginBtn">ログイン</button>
    <button class="solid" id="signupBtn">はじめる</button>
  </div>
</header>
<div class="menu" id="acctMenu">
  <button onclick="openMyPage()">マイページ（プロフィール編集）</button>
  <button onclick="pickVerify()">本人確認を申請</button>
  <button onclick="doLogout()">ログアウト</button>
</div>

<main id="view-home">
  <section class="lead">
    <h1>同じ立場だからこそ、<br>肩の力を抜いて話せる。</h1>
    <p>安心してつながることを大切にした、大人のためのマッチング。まずは気になる人を探してみてください。</p>
  </section>
  <div class="filters">
    <select id="fGender"><option value="">性別すべて</option><option value="female">女性</option><option value="male">男性</option><option value="other">その他</option></select>
    <select id="fArea"><option value="">エリアすべて</option><option>東京都</option><option>神奈川県</option><option>大阪府</option><option>愛知県</option><option>福岡県</option><option>北海道</option></select>
    <select id="fAge"><option value="">年齢すべて</option><option value="20,29">20代</option><option value="30,39">30代</option><option value="40,49">40代</option><option value="50,120">50代以上</option></select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- メッセージ一覧ページ -->
<section class="page" id="view-messages">
  <div class="pbar"><button class="back" onclick="goHome()">←</button><h2>メッセージ</h2></div>
  <div class="tabs">
    <button id="tabTalk" class="active" onclick="setConvTab('talk')">トーク中</button>
    <button id="tabMatch" onclick="setConvTab('match')">マッチ中<span class="tbadge" id="matchTabBadge" style="display:none">0</span></button>
  </div>
  <div class="convlist" id="convlist"></div>
</section>

<!-- トークページ -->
<section class="page" id="view-chat">
  <div class="pbar">
    <button class="back" onclick="goMessages()">←</button>
    <div class="cav" id="chatAvatar"></div>
    <h2 id="chatName"></h2>
    <div class="spacer"></div>
    <button class="iconbtn" id="chatMenuBtn" title="メニュー">⋯</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div id="composerHolder"></div>
  <div class="selbar" id="selBar" style="display:none">
    <span class="cnt" id="selCnt">0件選択中</span>
    <button class="ghost" style="border:1px solid var(--line)" onclick="exitSelect()">キャンセル</button>
    <button class="solid" onclick="deleteSelected()">削除</button>
  </div>
  <div class="cmenu-scrim" id="chatMenuScrim"><div class="cmenu" id="chatMenu"></div></div>
</section>

<!-- モーダル群 -->
<div class="scrim" id="authScrim"><div class="modal">
  <h2 id="authTitle" class="mincho">はじめる</h2>
  <button class="gbtn" id="googleBtn" style="margin-top:14px" onclick="location.href='/api/auth/google'">Googleで続ける</button>
  <div class="divider">または</div>
  <div id="authFields"></div>
  <div class="err" id="authErr"></div>
  <button class="solid full" id="authSubmit">登録する</button>
  <div class="switch" id="authSwitch"></div>
  <div class="note">18歳以上の方のみご利用いただけます。登録により利用規約に同意したものとみなします。</div>
</div></div>
<div class="scrim" id="pScrim"><div class="modal" id="pModal"></div></div>
<div class="scrim" id="likesScrim"><div class="modal" id="likesModal"></div></div>
<div class="scrim" id="onboardScrim"><div class="modal" id="onboardModal"></div></div>
<div class="scrim" id="myScrim"><div class="modal" id="myModal"></div></div>

<input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" style="display:none">
<input type="file" id="verifyInput" accept="image/jpeg,image/png,image/webp,application/pdf" style="display:none">
<div class="toast" id="toast"></div>

<script>
const AREAS=['東京都','神奈川県','大阪府','愛知県','福岡県','北海道'];
const GRAD=['linear-gradient(135deg,#C56B72,#5C2A45)','linear-gradient(135deg,#7C6A9C,#3f3557)','linear-gradient(135deg,#5E7C6E,#37473f)','linear-gradient(135deg,#C98B6B,#7a4b34)','linear-gradient(135deg,#8C6B9C,#4a3557)','linear-gradient(135deg,#6B8CA0,#33505f)'];
const grad=s=>GRAD[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%GRAD.length];
const gLabel={female:'女性',male:'男性',other:'その他'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const photoURL=k=>'/api/photo?key='+encodeURIComponent(k);
let me=null, convMap={}, convTab='talk', chatState={matchId:null,after:0,timer:null}, unreadState={messages:0,likes:0}, unreadTimer=null;

async function api(path,opts={}){
  const r=await fetch('/api'+path,{credentials:'same-origin',...opts});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||'エラーが発生しました');e.data=d;e.status=r.status;throw e;}
  return d;
}
const jpost=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2600);}
function avatarHTML(o){ return o.photo_key?`<img src="${photoURL(o.photo_key)}" alt="">`:`<span class="ini">${esc(String(o.display_name)[0]||'?')}</span>`; }
function fmtTime(ts){
  if(!ts)return'';
  const d=new Date(ts),now=new Date();
  const sameDay=d.toDateString()===now.toDateString();
  return sameDay?d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):`${d.getMonth()+1}/${d.getDate()}`;
}

async function loadMe(){ try{me=await api('/me');}catch{me=null;} renderAuthState(); }
function renderAuthState(){
  document.getElementById('loginBtn').style.display=me?'none':'';
  document.getElementById('msgBtn').style.display=me?'':'none';
  document.getElementById('likesBtn').style.display=me?'':'none';
  document.getElementById('signupBtn').textContent=me?`${me.display_name||'アカウント'} さん`:'はじめる';
  document.body.classList.add('ready');
  if(me){ startUnreadPoll(); } else { stopUnreadPoll(); }
}

/* ---- explorer ---- */
async function loadProfiles(){
  const g=document.getElementById('fGender').value,a=document.getElementById('fArea').value;
  const [min,max]=(document.getElementById('fAge').value||'').split(',');
  const qs=new URLSearchParams();
  if(g)qs.set('gender',g); if(a)qs.set('area',a); if(min)qs.set('min',min); if(max)qs.set('max',max);
  const {items}=await api('/profiles?'+qs.toString());
  const grid=document.getElementById('grid');
  grid.innerHTML=items.length?'':'<p style="color:var(--muted)">条件に合う方が見つかりませんでした。</p>';
  for(const it of items){
    const el=document.createElement('div'); el.className='card';
    el.innerHTML=`<div class="ava" style="background:${grad(it.display_name)}">${it.verified?'<div class="badge">本人確認済み</div>':''}${avatarHTML(it)}</div>
      <div class="info"><div class="name"><b>${esc(it.display_name)}</b> ${it.age}</div>
        <div class="meta">${gLabel[it.gender]||''}・${esc(it.area)}</div>
        <div class="tag">${esc(it.tagline)}</div></div>`;
    el.onclick=()=>openProfileById(it.user_id);
    grid.appendChild(el);
  }
}
['fGender','fArea','fAge'].forEach(id=>document.getElementById(id).onchange=loadProfiles);

async function openProfileById(id){
  if(!id)return;
  try{ const p=await api('/profile?user_id='+encodeURIComponent(id)); renderProfile(p); }
  catch(e){ toast(e.message); }
}
function renderProfile(p){
  const photos=(p.photos&&p.photos.length)?p.photos:[];
  const mainImg=photos.length
    ? `<img id="pfMain" src="${photoURL(photos[0])}" style="width:100%;height:300px;object-fit:cover;border-radius:14px">`
    : `<div class="big" style="width:100%;height:180px;border-radius:14px;background:${grad(p.display_name)}"><span class="ini" style="font-size:56px">${esc(String(p.display_name)[0]||'?')}</span></div>`;
  const thumbs=photos.length>1
    ? `<div style="display:flex;gap:8px;margin-top:8px;overflow-x:auto">${photos.map(k=>`<img src="${photoURL(k)}" onclick="var m=document.getElementById('pfMain');if(m)m.src='${photoURL(k)}'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none">`).join('')}</div>`
    : '';
  document.getElementById('pModal').innerHTML=`
    ${mainImg}${thumbs}

/* ---- トークルーム ---- */
function showChat(matchId){
  const info=convMap[matchId];
  chatState={matchId,after:0,timer:null,partnerId:info?info.user_id:null};
  document.getElementById('chatName').textContent=info?info.name:'';
  const av=document.getElementById('chatAvatar');
  av.style.background=info?grad(info.name):'';
  av.innerHTML=info?avatarHTML({display_name:info.name,photo_key:info.photo_key}):'';
  document.getElementById('msgs').innerHTML='';
  document.getElementById('selBar').style.display='none';
  document.getElementById('composerHolder').style.display='';
  buildChatMenu();
  const canSend=me&&(me.plan==='standard'||me.plan==='premium');
  document.getElementById('composerHolder').innerHTML=canSend?`
    <div class="composer"><input id="msgInput" placeholder="メッセージを入力" maxlength="2000"><button class="solid" id="sendBtn">送信</button></div>`:`
    <div class="planbar" onclick="openUpgrade()">メッセージの送信はスタンダードプラン以上でご利用いただけます（タップして詳細）</div>`;
  document.getElementById('view-chat').classList.add('on');
  if(canSend){
    document.getElementById('sendBtn').onclick=doSend;
    document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();doSend();}});
  }
  pollMessages(true);
  chatState.timer=setInterval(()=>pollMessages(false),3000);
  jpost('/read',{match_id:matchId}).then(()=>pollUnread()).catch(()=>{});
}
function stopChatPoll(){ if(chatState.timer){clearInterval(chatState.timer);chatState.timer=null;} chatState.matchId=null; }
function appendBubble(m,mine,animate){
  const box=document.getElementById('msgs');
  const w=document.createElement('div'); w.className='bwrap '+(mine?'me':'you')+(animate?' enter':'');
  w.dataset.id=m.id; w.dataset.ts=m.created_at; w.dataset.me=mine?'1':'0';
  const b=document.createElement('div'); b.className='b '+(mine?'me':'you'); b.textContent=m.body;
  const t=document.createElement('div'); t.className='btime'; t.textContent=fmtTime(m.created_at);
  w.appendChild(b); w.appendChild(t); box.appendChild(w);
  return w;
}
function updateReceipts(readAt){
  const box=document.getElementById('msgs'); if(!box)return;
  box.querySelectorAll('.receipt').forEach(r=>r.remove());
  const mine=[...box.querySelectorAll('.bwrap.me')].filter(w=>Number(w.dataset.ts)<=readAt);
  if(mine.length){ const r=document.createElement('div'); r.className='receipt'; r.textContent='既読'; mine[mine.length-1].appendChild(r); }
}
async function pollMessages(initial){
  if(!chatState.matchId)return;
  try{
    const data=await api(`/messages?match_id=${chatState.matchId}&after=${chatState.after}`);
    const uid=data.me;
    const box=document.getElementById('msgs'); if(!box||!document.getElementById('view-chat').classList.contains('on'))return;
    let added=false;
    for(const m of data.items){ chatState.after=Math.max(chatState.after,m.created_at); appendBubble(m,m.from_id===uid,!initial); added=true; }
    updateReceipts(data.read_at||0);
    if(added){ box.scrollTop=box.scrollHeight; jpost('/read',{match_id:chatState.matchId}).then(()=>pollUnread()).catch(()=>{}); }
    else if(initial) box.scrollTop=box.scrollHeight;
  }catch(e){}
}
async function doSend(){
  const input=document.getElementById('msgInput'); if(!input)return;
  const text=input.value.trim(); if(!text)return; input.value='';
  try{
    const m=await jpost('/messages',{match_id:chatState.matchId,body:text});
    chatState.after=Math.max(chatState.after,m.created_at);
    appendBubble(m,true,true);
    const box=document.getElementById('msgs'); box.scrollTop=box.scrollHeight;
  }catch(e){ if(e.status===402){openUpgrade();} else toast(e.message); }
}

async function doLogout(){toggleMenu(false);try{await jpost('/logout',{});}catch{} me=null;renderAuthState();goHome();loadProfiles();toast('ログアウトしました');}

/* ---- 共通 ---- */
function closeModals(){ document.querySelectorAll('.scrim').forEach(s=>{ if(s.id!=='onboardScrim') s.classList.remove('on'); }); }
document.querySelectorAll('.scrim').forEach(s=>s.onclick=e=>{if(e.target===s&&s.id!=='onboardScrim')s.classList.remove('on');});
function toggleMenu(on){document.getElementById('acctMenu').classList.toggle('on',on);}
document.getElementById('loginBtn').onclick=()=>openAuth('login');
document.getElementById('msgBtn').onclick=navMessages;
document.getElementById('likesBtn').onclick=openLikes;
document.getElementById('chatMenuBtn').onclick=openChatMenu;
document.getElementById('chatMenuScrim').onclick=e=>{ if(e.target.id==='chatMenuScrim') closeChatMenu(); };
document.getElementById('msgs').addEventListener('click',e=>{ if(!selecting)return; const w=e.target.closest('.bwrap.me'); if(!w)return; w.classList.toggle('sel'); updateSelCnt(); });
document.getElementById('signupBtn').onclick=()=>{ if(me) toggleMenu(!document.getElementById('acctMenu').classList.contains('on')); else openAuth('signup'); };
document.addEventListener('click',e=>{ if(!e.target.closest('#acctMenu')&&e.target.id!=='signupBtn') toggleMenu(false); });

(async()=>{
  await loadMe(); loadProfiles();
  if(me && me.needs_onboarding) openOnboard();
  const sp=new URLSearchParams(location.search);
  if(sp.get('auth_error')) toast('ログインに失敗しました。もう一度お試しください');
  if(sp.get('upgraded')) toast('アップグレードありがとうございます');
  if(location.search) history.replaceState({},'',location.pathname+location.hash);
  router();
})();
</script>
