name = "matching-site"
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "matching"
database_id = "REPLACE_WITH_D1_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "matching-photos"

[vars]
APP_URL = "https://matching-site.example.workers.dev"
STRIPE_PRICE_STANDARD = "price_xxx_standard"
STRIPE_PRICE_PREMIUM  = "price_xxx_premium"
